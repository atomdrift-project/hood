name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private registry URLs, payloads, or CA material.
  - type: input
    id: version
    attributes:
      label: hood version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, architecture, and shell
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Wrapped tool and version
      placeholder: npm 11.4.2
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a public or synthetic target and redact sensitive values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
