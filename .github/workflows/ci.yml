name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  YRX_REGENERATE_MODULES_RS: "false"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject local path dependencies
        run: |
          if grep -nE '^[[:space:]]*[^#].*path[[:space:]]*=[[:space:]]*"\.\.' Cargo.toml; then
            echo "::error file=Cargo.toml::local path dependency committed"
            exit 1
          fi
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup run stable cargo fmt --all --check
      - run: rustup run stable cargo clippy --locked --all-targets -- -D warnings
      - run: git diff --exit-code Cargo.lock

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check with Cargo.toml's rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          rustup run "$msrv" cargo check --locked

  # Windows builds with MSVC and runs the unit tests. The runner's Defender
  # quarantines the malware fixtures that filefacts' build script hashes, so
  # the cargo home and workspace are excluded before the first build.
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exclude build trees from Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo", "$env:GITHUB_WORKSPACE"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup run stable cargo clippy --locked --all-targets -- -D warnings
      - run: rustup run stable cargo test --locked --lib --bins

  # End-to-end command integrations on Windows: the same hermetic harness as the
  # other platforms, scoped to the tools the runner ships. It exercises the
  # Windows-specific paths — PATHEXT shim resolution, Schannel curl trust, the
  # cargo revocation flag, and the Go loopback bridge. The Defender exclusions
  # keep it from quarantining the filefacts build fixture (under .cargo) and the
  # scan rules the local-analysis scenarios download (under %APPDATA%).
  windows-integration:
    name: tools on windows
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HOOD_REQUIRE_TOOL_INTEGRATION: curl,npm,npx,pip,cargo,go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exclude build and data trees from Defender
        shell: pwsh
        run: >-
          Add-MpPreference -ExclusionPath
          "$env:USERPROFILE\.cargo", "$env:GITHUB_WORKSPACE",
          "$env:APPDATA\atomdrift", "$env:LOCALAPPDATA\atomdrift"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify tool inventory
        shell: pwsh
        run: foreach ($t in "curl","npm","npx","pip","cargo","go") { Get-Command $t -ErrorAction Stop | Out-Null }
      - name: Run hermetic command integrations
        run: rustup run stable cargo test --locked --release --test tool_integration -- --test-threads=1

  # Every supported command runs against local fixtures, directly and through
  # hood; hood must succeed visibly and within 2x the direct time. The test
  # suite fails if a supported command is missing from every require list.
  tool-integration:
    name: tools on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            zig: x86_64-linux
            zig-sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          - os: macos-15
            zig: aarch64-macos
            zig-sha256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
    env:
      HOOD_REQUIRE_TOOL_INTEGRATION: curl,wget,brew,npm,npx,pnpm,pnpx,yarn,rush,rushx,bun,bunx,pip,pip3,pipx,uv,uvx,poetry,pdm,go,cargo,zig,rpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install integration toolchains
        env:
          ZIG: zig-${{ matrix.zig }}-0.17.0
          ZIG_SHA256: ${{ matrix.zig-sha256 }}
        run: |
          npm install --global pnpm@11.21.0 @microsoft/rush@5.178.1 bun@1.3.14 yarn@1.22.22
          pipx install pdm==2.26.9
          pipx install uv==0.12.3
          pipx install poetry==2.5.1
          curl -fsSLo "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/0.17.0/$ZIG.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 --check --strict
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$ZIG" >> "$GITHUB_PATH"
          # Some images ship pip only as pip3.
          command -v pip >/dev/null || sudo ln -s "$(command -v pip3)" /usr/local/bin/pip
      - name: Install Linux integration tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install macOS integration tools
        if: runner.os == 'macOS'
        # The macOS image keeps Go only in the setup-go tool cache, off PATH.
        run: brew install rpm go
      - name: Verify tool inventory
        run: |
          for tool in $(echo "$HOOD_REQUIRE_TOOL_INTEGRATION" | tr ',' ' '); do
            command -v "$tool"
          done
      - name: Run hermetic command integrations
        run: cargo test --locked --release --test tool_integration -- --test-threads=1

  # Distribution package managers run as their distributions intend, in
  # digest-pinned images; see tests/distro/.
  distro-integration:
    name: tools on ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:base-devel-20261018.0.612668@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
            require-tools: pacman,makepkg,yay,paru
          - distro: fedora
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            require-tools: dnf,yum,rpm
          - distro: opensuse
            image: opensuse/tumbleweed:latest@sha256:cbae3d25ca359a916e3dff8fd8913fe8943002baeb6f94b4ca4305e201edc43a
            require-tools: zypper,rpm
          - distro: alpine
            image: alpine:3.22.7@sha256:e9f2de928efcc1b53d0948e684b4f490315f280de6044844ec0ff26c0b44d3cf
            require-tools: apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run hermetic command integrations
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
          HOOD_REQUIRE_TOOL_INTEGRATION: ${{ matrix['require-tools'] }}
        run: >-
          docker run --rm -e HOOD_REQUIRE_TOOL_INTEGRATION
          -v "$PWD:/src:ro" -w /src "$IMAGE" sh "tests/distro/$DISTRO.sh"

  freebsd-integration:
    name: tools on freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run hermetic command integrations in FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        env:
          HOOD_REQUIRE_TOOL_INTEGRATION: pkg,curl
        with:
          usesh: true
          release: "15.1"
          cpu: "4"
          mem: "12288"
          envs: "CARGO_TERM_COLOR CARGO_INCREMENTAL RUST_BACKTRACE YRX_REGENERATE_MODULES_RS HOOD_REQUIRE_TOOL_INTEGRATION"
          prepare: |
            pkg install -y rust cmake pkgconf git curl
          run: |
            set -eux
            # Keep target/ out of the workspace the action syncs back.
            export CARGO_TARGET_DIR=/tmp/target
            cargo test --locked --release --test tool_integration -- --test-threads=1

  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      profile: release
