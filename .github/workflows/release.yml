name: Prerelease

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build; empty performs a dry run of the selected ref.
        type: string
        default: ""
      target:
        description: Build one target; empty builds the complete shipping matrix.
        type: string
        default: ""
      publish:
        description: Publish the prerelease (requires a tag).
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || '' }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$GITHUB_REF" in refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;; *) tag="$REQUESTED_TAG" ;; esac
          if [ -n "$tag" ]; then
            case "$tag" in v*) ;; *) echo "::error::release tag must start with v"; exit 1 ;; esac
            test "${tag#v}" = "$version" || { echo "::error::$tag does not match Cargo.toml $version"; exit 1; }
          elif [ "$PUBLISH" = true ]; then
            echo "::error::publishing requires a v* tag"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.verify.outputs.tag }}
      target: ${{ inputs.target || '' }}
      profile: release-lto
      sign: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
      notarize: ${{ vars.MACOS_NOTARIZATION_ENABLED == 'true' }}
      require-notarization: ${{ needs.verify.outputs.publish == 'true' && vars.MACOS_NOTARIZATION_ENABLED == 'true' }}
    secrets:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hood-*
          merge-multiple: true
          path: dist
      - name: Inventory targets
        env:
          EXPECTED: >-
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
            aarch64-apple-darwin x86_64-apple-darwin
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl
            arm-unknown-linux-musleabihf armv7-unknown-linux-musleabihf
            loongarch64-unknown-linux-musl s390x-unknown-linux-gnu
            riscv64gc-unknown-linux-gnu powerpc64le-unknown-linux-gnu
            x86_64-unknown-freebsd x86_64-unknown-openbsd
            x86_64-unknown-netbsd x86_64-unknown-illumos
            x86_64-pc-solaris x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
          REQUESTED_TARGET: ${{ inputs.target || '' }}
        run: |
          set -eu
          missing=""
          for target in $EXPECTED; do
            if [ -n "$REQUESTED_TARGET" ] && [ "$target" != "$REQUESTED_TARGET" ]; then continue; fi
            if [ -f "dist/hood-$target.tar.gz" ]; then
              echo "ok      $target"
            else
              echo "MISSING $target"
              missing="$missing $target"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::release is missing targets:$missing"
            echo "Missing targets:$missing" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$REQUESTED_TARGET" ]; then exit 1; fi
          fi
      - name: Assemble checksummed assets
        run: |
          set -eu
          cd dist
          for file in hood-*.tar.gz; do
            target="${file#hood-}"
            target="${target%.tar.gz}"
            mv "$file" "hood-$VERSION-$target.tar.gz"
          done
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: cyclonedx-json
          output-file: dist/hood-${{ needs.verify.outputs.version }}.cdx.json
          upload-artifact: false
      - name: Attest build provenance
        if: ${{ needs.verify.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hood-${{ needs.verify.outputs.version }}-release
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        if: ${{ needs.verify.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --prerelease --generate-notes
          fi
