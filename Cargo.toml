[package]
name = "hood"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["The Atomdrift Project"]
description = "Scan HTTP(S) payloads before they reach package managers, installers, and curl|sh scripts"
license = "Apache-2.0"
repository = "https://github.com/atomdrift-project/hood"
homepage = "https://github.com/atomdrift-project/hood"
readme = "README.md"
keywords = ["malware", "supply-chain", "package-manager", "security", "proxy"]
categories = ["command-line-utilities", "development-tools", "network-programming"]

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
# Caught real bugs (silently-dropped TLS-accept results); cheap to satisfy.
let_underscore_drop = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# No silent failure modes in production paths.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
result_unit_err = "deny"
dbg_macro = "deny"
# A Drop bypass leaks secrets or fds in a long-running network daemon.
mem_forget = "deny"
# `.map_err(|_| anyhow!("..."))` discards the underlying cause; require it
# to be carried in the new error.
map_err_ignore = "warn"
# Redundant allocation; `.to_owned()` is the right call.
str_to_string = "warn"
# Truncating casts in security-relevant integer math (sizes, counts).
cast_possible_truncation = "warn"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fletch = { git = "https://github.com/atomdrift-project/fletch.git" }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client", "client-legacy", "http1"] }
percent-encoding = "2"
scan = { package = "atomdrift-scan", git = "https://github.com/atomdrift-project/scan.git" }
rcgen = { version = "0.14", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
sha2 = "0.11"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
url = "2"

[dev-dependencies]
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tar = "0.4"
tokio = { version = "1", features = ["test-util", "macros"] }
zip = { version = "8.6", default-features = false }

[[bin]]
name = "hood"
path = "src/main.rs"

[lib]
name = "hood"
path = "src/lib.rs"

[profile.release]
strip = "debuginfo"
lto = "thin"

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1


# illumos support for tree-sitter's vendored endian.h, pulled in transitively
# via scan and fletch. In 0.26.11 the only illumos arm tests __illumos__, which
# illumos-gcc predefines but cross-rs's x86_64-unknown-illumos-gcc does not, so
# the build hits "#error platform not supported" at endian.h:238. Upstream
# added a __sun arm over <sys/byteorder.h> in 77cb23fc, still unreleased.
#
# Both crates must come from the same source: tree-sitter uses its in-tree
# tree-sitter-language, and `links = "tree-sitter-language"` permits only one
# copy in the graph. Upstream master is 0.27.0 and unpublished — crates.io
# tops out at 0.26.11 — so this is load-bearing for resolution, not only for
# the fix, and every root in this tree needs an identical block: cleave,
# filefacts, fletch, hood and scan. Remove from all five once a release
# carries it.
[patch.crates-io]
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "963b5a5a971021359cf091a63d4f1286bc319643" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "963b5a5a971021359cf091a63d4f1286bc319643" }
