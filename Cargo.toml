[package]
name = "hood"
version = "0.1.0"
edition = "2021"
authors = ["The Atomdrift Project"]
description = "Scan HTTP(S) payloads before they reach package managers, installers, and curl|sh scripts"
license = "Apache-2.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
# Caught real bugs (silently-dropped TLS-accept results); cheap to satisfy.
let_underscore_drop = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# No silent failure modes in production paths.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
result_unit_err = "deny"
dbg_macro = "deny"
# A Drop bypass leaks secrets or fds in a long-running network daemon.
mem_forget = "deny"
# `.map_err(|_| anyhow!("..."))` discards the underlying cause; require it
# to be carried in the new error.
map_err_ignore = "warn"
# Redundant allocation; `.to_owned()` is the right call.
str_to_string = "warn"
# Truncating casts in security-relevant integer math (sizes, counts).
cast_possible_truncation = "warn"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fletch = { git = "https://codeberg.org/atomdrift/fletch.git" }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client", "client-legacy", "http1"] }
scan = { package = "atomdrift-scan", path = "../scan" }
rcgen = { version = "0.13", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["test-util", "macros"] }

[[bin]]
name = "hood"
path = "src/main.rs"

[lib]
name = "hood"
path = "src/lib.rs"

[profile.release]
strip = "debuginfo"
lto = "thin"

# The `scan` dependency uses `fletch::fetch::fetch_references_with`, which lives
# in local fletch ahead of a published release. `[patch]` only applies from the
# top-level crate, so hood must mirror scan's patch to resolve fletch to the same
# local source. Remove once fletch publishes a git rev carrying that API.
[patch."https://codeberg.org/atomdrift/fletch.git"]
fletch = { path = "../fletch" }
